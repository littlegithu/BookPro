services:
  - type: web
    name: bookpro-backend
    runtime: python
    buildCommand: pip install pipenv && pipenv install --deploy
    startCommand: cd backend && gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bookpro-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
